name: personal-assistant

services:
  personal-assistant:
    build:
      context: ../..
      dockerfile: apps/personal-assistant/Dockerfile
      target: production
    env_file:
      - .env
    environment:
      OBSIDIAN_VAULT_PATH: /data/obsidian-vault
    volumes:
      - ${OBSIDIAN_VAULT_HOST_PATH:-./src/obsidian-vault}:/data/obsidian-vault
      - ${DATA_HOST_PATH:-./data}:/app/apps/personal-assistant/data
      - ${LOGS_HOST_PATH:-./logs}:/app/apps/personal-assistant/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  personal-assistant-scheduler:
    build:
      context: ../..
      dockerfile: apps/personal-assistant/Dockerfile
      target: production
    env_file:
      - .env
    environment:
      OBSIDIAN_VAULT_PATH: /data/obsidian-vault
    command: ["node", "dist/scheduler/index.js"]
    volumes:
      - ${OBSIDIAN_VAULT_HOST_PATH:-./src/obsidian-vault}:/data/obsidian-vault
      - ${DATA_HOST_PATH:-./data}:/app/apps/personal-assistant/data
      - ${LOGS_HOST_PATH:-./logs}:/app/apps/personal-assistant/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  personal-assistant-dev:
    build:
      context: ../..
      dockerfile: apps/personal-assistant/Dockerfile
      target: development
    profiles:
      - dev
    env_file:
      - .env
    environment:
      OBSIDIAN_VAULT_PATH: /data/obsidian-vault
    command: sh -c "yes | pnpm install && pnpm dev"
    volumes:
      - ../..:/app
      - personal-assistant-node-modules:/app/node_modules
      - ${OBSIDIAN_VAULT_HOST_PATH:-./src/obsidian-vault}:/data/obsidian-vault
    restart: unless-stopped

volumes:
  personal-assistant-node-modules:

# Future services can be added here without changing the bot's mount or env contract.
